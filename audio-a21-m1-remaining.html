<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Whale — A2.1 Module 1 Remaining Audio</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:900px;margin:48px auto;padding:0 20px;color:#151515}
button{font:inherit;padding:12px 18px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:10px}
audio{width:100%;margin:8px 0 18px}
.small{color:#666;font-size:14px}
</style>
</head>
<body>
<h1>A2.1 · Module 1 · Remaining audio</h1>
<p>Generates only the 17 example sentences and the 2 listening stories. The P phrase clips are not regenerated.</p>
<p class="small">Voice: Jessica · speed 0.90.</p>
<button id="run">Generate 19 remaining files</button>
<pre id="status">Ready.</pre>
<audio id="story1" controls hidden></audio>
<audio id="story2" controls hidden></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
(async()=>{
  const client=window.spaceWhaleSupabase;
  const run=document.getElementById('run');
  const status=document.getElementById('status');
  const story1=document.getElementById('story1');
  const story2=document.getElementById('story2');

  const {data:{session}}=await client.auth.getSession();
  if(!session){run.disabled=true;status.textContent='No active Space Whale owner session.';return;}

  const clips=[
    {path:'a2-1/m1/l1/listen-repeat/A2_SEQ_E01.mp3',text:'First, we bought the tickets.',speed:.90},
    {path:'a2-1/m1/l1/listen-repeat/A2_SEQ_E02.mp3',text:'To begin with, we checked the address.',speed:.90},
    {path:'a2-1/m1/l1/listen-repeat/A2_SEQ_E03.mp3',text:'Then, we took a bus.',speed:.90},
    {path:'a2-1/m1/l1/listen-repeat/A2_SEQ_E04.mp3',text:'Next, we walked to the hotel.',speed:.90},
    {path:'a2-1/m1/l1/listen-repeat/A2_SEQ_E05.mp3',text:'After that, we had lunch.',speed:.90},
    {path:'a2-1/m1/l1/listen-repeat/A2_SEQ_E06.mp3',text:'Afterwards, we went for a walk.',speed:.90},
    {path:'a2-1/m1/l1/listen-repeat/A2_SEQ_E07.mp3',text:'Later, we met some friends.',speed:.90},
    {path:'a2-1/m1/l1/listen-repeat/A2_SEQ_E08.mp3',text:'Eventually, we found the right place.',speed:.90},
    {path:'a2-1/m1/l1/listen-repeat/A2_SEQ_E09.mp3',text:'Finally, we arrived at the hotel.',speed:.90},
    {path:'a2-1/m1/l1/listen-repeat/A2_SEQ_E10.mp3',text:'In the end, everything was fine.',speed:.90},

    {path:'a2-1/m1/l2/listen-repeat/A2_MOVE_E01.mp3',text:'We climbed up the ladder.',speed:.90},
    {path:'a2-1/m1/l2/listen-repeat/A2_MOVE_E02.mp3',text:'He climbed over the low wall.',speed:.90},
    {path:'a2-1/m1/l2/listen-repeat/A2_MOVE_E03.mp3',text:'She jumped over the log.',speed:.90},
    {path:'a2-1/m1/l2/listen-repeat/A2_MOVE_E04.mp3',text:'She stepped onto the rock.',speed:.90},
    {path:'a2-1/m1/l2/listen-repeat/A2_MOVE_E05.mp3',text:'We moved into the room.',speed:.90},
    {path:'a2-1/m1/l2/listen-repeat/A2_MOVE_E06.mp3',text:'The girl came out of the tent.',speed:.90},
    {path:'a2-1/m1/l2/listen-repeat/A2_MOVE_E07.mp3',text:'The dog ran around the tree.',speed:.90},

    {path:'a2-1/m1/l1/listening/A2_SEQ_STORY.mp3',text:"I couldn’t find my phone after lunch. My friend was waiting for me at the cinema. First, I checked my bag. It wasn’t there. Then I looked in my jacket pockets. Nothing. I went back to the café and asked the waiter for help. We checked the tables and the floor. Eventually, he found it behind a chair. After that, I called my friend and walked to the cinema. In the end, I arrived before the film started.",speed:.90},
    {path:'a2-1/m1/l2/listening/A2_MOVE_STORY.mp3',text:'We were camping near a lake. I was sitting outside our tent when our dog Max came out. He ran around a tree and then jumped over a log. My sister Sara stepped onto a rock to take a photo of him. Later, it started to rain, so we all moved into the tent. Max went to sleep, but Sara and I stayed awake and played cards.',speed:.90}
  ];

  run.onclick=async()=>{
    run.disabled=true;story1.hidden=true;story2.hidden=true;
    status.textContent='Generating 17 example clips + 2 stories...';
    const {data,error}=await client.functions.invoke('generate-course-tts',{
      body:{voice_id:'cgSgspJ2msm6clMCkdW9',clips}
    });
    if(error){
      let details='';
      try{if(error.context?.clone)details=await error.context.clone().text();}catch{}
      status.textContent='FAILED\n'+(error.message||String(error))+(details?'\n\nServer response:\n'+details:'');
      run.disabled=false;
      return;
    }
    status.textContent='SUCCESS\n'+JSON.stringify(data,null,2);
    const base='https://xpeywyonbapnvtjnwawi.supabase.co/storage/v1/object/public/course-audio/';
    story1.src=base+'a2-1/m1/l1/listening/A2_SEQ_STORY.mp3?v='+Date.now();
    story2.src=base+'a2-1/m1/l2/listening/A2_MOVE_STORY.mp3?v='+Date.now();
    story1.hidden=false;story2.hidden=false;
  };
})();
</script>
</body>
</html>
