<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Space Whale — Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-shell.css?v=20260921-navigation-v1">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <a class="sw-brand" href="index.html">Space Whale</a>
      <h1>Reset password</h1>
      <p>Enter the email for your Space Whale account. We’ll send you a secure reset link.</p>

      <form id="resetRequestForm" class="sw-form">
        <div class="sw-field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <button id="resetButton" class="sw-button" type="submit">Send reset link</button>
        <a class="sw-button secondary" href="login.html">Back to sign in</a>
        <div id="resetMessage" class="sw-message"></div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=20260920-backend-v1"></script>
  <script>
    const form = document.getElementById("resetRequestForm");
    const button = document.getElementById("resetButton");
    const message = document.getElementById("resetMessage");
    const emailInput = document.getElementById("email");

    const prefill = new URLSearchParams(location.search).get("email");
    if (prefill) emailInput.value = prefill;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Sending reset link…";

      const redirectTo = new URL("update-password.html", location.href).href;
      const { error } = await window.spaceWhaleSupabase.auth.resetPasswordForEmail(
        emailInput.value.trim(),
        { redirectTo }
      );

      button.disabled = false;

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = "Reset link sent. Open the email on this phone, then choose a new password.";
    });
  </script>
</body>
</html>
