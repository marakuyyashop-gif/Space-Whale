<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Space Whale — Student Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-shell.css?v=20260921-student-shell-v1">
</head>
<body class="student-home-body">
  <div id="studentApp" class="student-app" hidden>
    <aside class="student-sidebar" data-student-sidebar data-active="home"></aside>
    <main class="student-main">
      <header class="student-page-header">
        <div>
          <span class="student-eyebrow">MY SPACE</span>
          <h1>Home</h1>
          <p>Your next lessons, access and learning overview.</p>
        </div>
      </header>

      <div class="student-home-grid">
        <section class="sw-card">
          <h2 class="sw-section-title">Upcoming lessons</h2>
          <div id="studentLessons" class="lesson-list"><div class="sw-message">Loading…</div></div>
        </section>

        <aside class="sw-stack">
          <section class="sw-card">
            <h2 class="sw-section-title">Lesson access</h2>
            <div id="accessSummary" class="sw-message">Checking access…</div>
          </section>
          <section class="sw-card">
            <h2 class="sw-section-title">Packages</h2>
            <div id="studentProducts" class="product-list"></div>
            <div id="paymentMessage" class="sw-message"></div>
          </section>
        </aside>
      </div>
    </main>
  </div>

  <div id="pageLoading" class="page-loading">Loading your learning space…</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=20260920-backend-v1"></script>
  <script src="auth.js?v=20260921-teacher-settings-v1"></script>
  <script src="student-shell.js?v=20260921-student-shell-v1"></script>
  <script src="student-dashboard.js?v=20260921-student-shell-v1"></script>
</body>
</html>
