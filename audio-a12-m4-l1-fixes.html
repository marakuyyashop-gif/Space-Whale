<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Whale — A1.2 M4 L1 Audio Fixes</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:820px;margin:48px auto;padding:0 20px;color:#151515}
button{font:inherit;padding:12px 18px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:10px}
.small{color:#666;font-size:14px}
</style>
</head>
<body>
<h1>A1.2 · Module 4 · Lesson 1 · Audio fixes</h1>
<p>Regenerate only the four requested Listen & Repeat clips with Jessica.</p>
<p class="small">0.95 for isolated words, 0.90 for the sentence. New filenames are used, so the current lesson audio stays untouched until these takes are approved.</p>
<button id="run">Generate 4 corrected clips</button>
<pre id="status">Ready.</pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
(async () => {
  const client = window.spaceWhaleSupabase;
  const run = document.getElementById('run');
  const status = document.getElementById('status');

  const { data: { session } } = await client.auth.getSession();
  if (!session) {
    run.disabled = true;
    status.textContent = 'No active Space Whale session. Sign in as owner on the main site, then reopen this page.';
    return;
  }

  const clips = [
    { path:'a1-2/w4/l1/listen-repeat/A1M4L1_WORD_01_r2.mp3', text:'Coat.', speed:0.95 },
    { path:'a1-2/w4/l1/listen-repeat/A1M4L1_SENTENCE_01_r2.mp3', text:'I need a coat for work.', speed:0.90 },
    { path:'a1-2/w4/l1/listen-repeat/A1M4L1_WORD_03_r2.mp3', text:'Blouse.', speed:0.95 },
    { path:'a1-2/w4/l1/listen-repeat/A1M4L1_WORD_06_r2.mp3', text:'Hat.', speed:0.95 }
  ];

  run.addEventListener('click', async () => {
    run.disabled = true;
    status.textContent = 'Generating 4 corrected clips...';

    const { data, error } = await client.functions.invoke('generate-course-tts', {
      body: {
        voice_id: 'cgSgspJ2msm6clMCkdW9',
        clips
      }
    });

    if (error) {
      let details = '';
      try {
        if (error.context && typeof error.context.clone === 'function') {
          details = await error.context.clone().text();
        }
      } catch {}
      status.textContent =
        'FAILED\n' +
        (error.message || String(error)) +
        (details ? '\n\nServer response:\n' + details : '');
      run.disabled = false;
      return;
    }

    status.textContent = 'SUCCESS\n' + JSON.stringify(data, null, 2);
  });
})();
</script>
</body>
</html>
