<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Space Whale — Reference Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260921-space-bg-v2" />
</head>
<body>
  <div id="root" class="reference-app">
    <aside class="app-sidebar" aria-label="Space Whale navigation">
      <div class="sidebar-header">
        <div class="sidebar-brand-row">
          <button class="sidebar-brand" type="button" aria-label="Space Whale home">
            <span class="brand-mark">SW</span>
            <span class="brand-name">Space Whale</span>
          </button>

          <div class="sidebar-header-actions">
            <button class="sidebar-icon-button" type="button" aria-label="Search">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            </button>
            <button class="sidebar-icon-button" type="button" aria-label="Collapse sidebar">
              <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M9 4v16"/></svg>
            </button>
          </div>
        </div>

        <nav class="sidebar-primary" aria-label="Main navigation">
          <button class="sidebar-nav-item active" type="button">
            <svg viewBox="0 0 24 24"><path d="M4 5.5h16v13H4z"/><path d="M8 3v5M16 3v5M4 9h16"/></svg>
            <span>Session</span>
          </button>

          <button class="sidebar-nav-item" type="button">
            <svg viewBox="0 0 24 24"><path d="M5 4.5h5.5v15H5zM13.5 4.5H19v15h-5.5z"/></svg>
            <span>Library</span>
          </button>

          <button class="sidebar-nav-item" type="button">
            <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="m8 12 2.2 2.2L16.5 8"/></svg>
            <span>Homework</span>
          </button>

          <button class="sidebar-nav-item" type="button">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3.5 20c.7-4.1 2.6-6.2 5.5-6.2s4.8 2.1 5.5 6.2M14 20c.4-2.8 1.7-4.2 4-4.2 1.2 0 2.2.4 3 1.2"/></svg>
            <span>Students</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-scroll">
        <div class="sidebar-section-heading">
          <span>Course</span>
          <button class="level-selector" type="button">
            <span>A2.1</span>
            <svg viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg>
          </button>
        </div>

        <div id="courseTree" class="course-tree"></div>
      </div>

      <footer class="sidebar-account">
        <div class="account-avatar">T</div>
        <div class="account-copy">
          <div class="account-name">Tutor</div>
          <div class="account-caption">Teacher account</div>
        </div>
        <button class="sidebar-icon-button" type="button" aria-label="Account menu">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        </button>
      </footer>
    </aside>

    <section class="class-area">
      <div class="module-banner">
        <div class="module-banner__copy">
          <div class="sparkle" aria-hidden="true">✦</div>
          <div>
            <div class="module-banner__title">Вы открыли задание модуля "A2.1 Модуль 2", сделать этот модуль текущим?</div>
            <div class="module-banner__subtitle">Сейчас у студента текущий модуль не выбран</div>
          </div>
        </div>
        <button type="button" class="secondary-btn">Да, сделать</button>
      </div>

      <main class="class-content">
        <div class="lesson-scroll" id="lessonContent"></div>
      </main>

      <div class="session-bar">
        <div class="session-left">
          <div class="session-state">
            <span class="session-state__icon">
              <svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><path d="M2.5 19c.7-3.8 2.5-5.7 5.5-5.7s4.8 1.9 5.5 5.7"/><path d="m16.5 8 4 4m0-4-4 4"/></svg>
            </span>
            <span>Student has not joined yet</span>
          </div>

          <div class="canvas-controls">
            <button type="button" class="canvas-control color-dot" aria-label="Color"></button>
            <button type="button" class="canvas-control" aria-label="Delete">
              <svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3m-8 0 1 13h8l1-13"/></svg>
            </button>
            <button type="button" class="canvas-control muted" aria-label="Undo">
              <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6"/></svg>
            </button>
            <button type="button" class="canvas-control muted" aria-label="Redo">
              <svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5m4-5h-8a6 6 0 0 0-6 6"/></svg>
            </button>
            <button type="button" class="canvas-control" aria-label="Remove participant">
              <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.7-3.7 2.5-5.6 5.5-5.6s4.8 1.9 5.5 5.6M17 9h5"/></svg>
            </button>
          </div>
        </div>

        <div class="session-right">
          <div class="session-controls">
            <button type="button" class="round-control" aria-label="Settings">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="m4.8 13.7-1.5-1.7 1.5-1.7.5-1.6-.6-2.2 2.2-1.2 1.6 1 1.7-.5L11 3h2l.8 2.8 1.7.5 1.6-1 2.2 1.2-.6 2.2.5 1.6 1.5 1.7-1.5 1.7-.5 1.6.6 2.2-2.2 1.2-1.6-1-1.7.5L13 21h-2l-.8-2.8-1.7-.5-1.6 1-2.2-1.2.6-2.2-.5-1.6Z"/></svg>
            </button>
            <button type="button" class="round-control" aria-label="Chat">
              <svg viewBox="0 0 24 24"><path d="M4 5.5h16v11H9l-5 3v-14Z"/></svg>
            </button>
            <button type="button" class="round-control" aria-label="Participant">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.8-4.1 3-6.2 6.5-6.2s5.7 2.1 6.5 6.2"/></svg>
            </button>
          </div>
          <button type="button" class="support-btn" aria-label="Support">?</button>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=20260920-backend-v1"></script>
  <script src="classroom-realtime.js?v=20260920-classroom-v2"></script>
  <script src="app.js?v=20260920-classroom-v2"></script>
</body>
</html>
