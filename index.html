<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Space Whale — Reference Clone</title>
  <link rel="stylesheet" href="styles.css?v=20260920-1816" />
</head>
<body>
  <div id="root" class="reference-app">
    <aside class="task-guide" aria-label="Lesson task guide">
      <header class="task-guide__header">
        <button class="module-select" type="button">
          <span>A2.1 Module 2. The Past (ver 2)</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 9h11.2c.9 0 1.3 1.1.7 1.7l-5.9 5.9a.5.5 0 0 1-.8 0l-5.9-5.9c-.6-.6-.2-1.7.7-1.7Z"/></svg>
        </button>
      </header>

      <div class="task-guide__scroll" id="taskGuide"></div>

      <footer class="task-guide__menu">
        <div class="task-guide__nav">
          <button type="button">Class</button>
          <button type="button" class="active">Library</button>
          <button type="button">Self Study</button>
          <button type="button" class="icon-btn" aria-label="Draw">
            <svg viewBox="0 0 24 24"><path d="m5 18 2.2-5.7L15.9 3.6a2 2 0 0 1 2.8 2.8L10 15.1 5 18Z"/><path d="m12.9 6.6 4.5 4.5"/></svg>
          </button>
          <button type="button" class="icon-btn" aria-label="Profile">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.8-4.1 3-6.2 6.5-6.2s5.7 2.1 6.5 6.2"/></svg>
          </button>
        </div>
        <div class="task-guide__menu-divider"></div>
        <div class="task-guide__bottom">
          <button type="button" class="icon-btn small" aria-label="Back">
            <svg viewBox="0 0 24 24"><path d="M9.5 5 3 12l6.5 7M4 12h17"/></svg>
          </button>
          <button type="button" class="start-btn" disabled>Start lesson</button>
        </div>
      </footer>
    </aside>

    <section class="class-area">
      <div class="module-banner">
        <div class="module-banner__copy">
          <div class="sparkle" aria-hidden="true">✦</div>
          <div>
            <div class="module-banner__title">Вы открыли задание модуля "A2.1 Модуль 2", сделать этот модуль текущим?</div>
            <div class="module-banner__subtitle">Сейчас у студента текущий модуль не выбран</div>
          </div>
        </div>
        <button type="button" class="secondary-btn">Да, сделать</button>
      </div>

      <main class="class-content">
        <div class="lesson-scroll" id="lessonContent"></div>
      </main>

      <div class="session-bar">
        <div class="session-left">
          <div class="session-state">
            <span class="session-state__icon">
              <svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><path d="M2.5 19c.7-3.8 2.5-5.7 5.5-5.7s4.8 1.9 5.5 5.7"/><path d="m16.5 8 4 4m0-4-4 4"/></svg>
            </span>
            <span>Student has not joined yet</span>
          </div>

          <div class="canvas-controls">
            <button type="button" class="canvas-control color-dot" aria-label="Color"></button>
            <button type="button" class="canvas-control" aria-label="Delete">
              <svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3m-8 0 1 13h8l1-13"/></svg>
            </button>
            <button type="button" class="canvas-control muted" aria-label="Undo">
              <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6"/></svg>
            </button>
            <button type="button" class="canvas-control muted" aria-label="Redo">
              <svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5m4-5h-8a6 6 0 0 0-6 6"/></svg>
            </button>
            <button type="button" class="canvas-control" aria-label="Remove participant">
              <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.7-3.7 2.5-5.6 5.5-5.6s4.8 1.9 5.5 5.6M17 9h5"/></svg>
            </button>
          </div>
        </div>

        <div class="session-right">
          <div class="session-controls">
            <button type="button" class="round-control" aria-label="Settings">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="m4.8 13.7-1.5-1.7 1.5-1.7.5-1.6-.6-2.2 2.2-1.2 1.6 1 1.7-.5L11 3h2l.8 2.8 1.7.5 1.6-1 2.2 1.2-.6 2.2.5 1.6 1.5 1.7-1.5 1.7-.5 1.6.6 2.2-2.2 1.2-1.6-1-1.7.5L13 21h-2l-.8-2.8-1.7-.5-1.6 1-2.2-1.2.6-2.2-.5-1.6Z"/></svg>
            </button>
            <button type="button" class="round-control" aria-label="Chat">
              <svg viewBox="0 0 24 24"><path d="M4 5.5h16v11H9l-5 3v-14Z"/></svg>
            </button>
            <button type="button" class="round-control" aria-label="Participant">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.8-4.1 3-6.2 6.5-6.2s5.7 2.1 6.5 6.2"/></svg>
            </button>
          </div>
          <button type="button" class="support-btn" aria-label="Support">?</button>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js?v=20260920-1816"></script>
</body>
</html>
