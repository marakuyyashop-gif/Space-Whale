<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Whale — Dialogue API Test</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;color:#151515}
button{font:inherit;padding:12px 18px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:10px}
audio{width:100%;margin-top:16px}
.small{color:#666;font-size:14px}
</style>
</head>
<body>
<h1>Dialogue API Test</h1>
<p>Owner-only smoke test for ElevenLabs Text to Dialogue.</p>
<p class="small">One click creates one short two-speaker generation and spends a small number of ElevenLabs credits.</p>
<button id="run">Generate test dialogue</button>
<pre id="status">Ready.</pre>
<audio id="audio" controls hidden></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
(async () => {
  const client = window.spaceWhaleSupabase;
  const run = document.getElementById('run');
  const status = document.getElementById('status');
  const audio = document.getElementById('audio');

  const { data: { session } } = await client.auth.getSession();
  if (!session) {
    run.disabled = true;
    status.textContent = 'No active Space Whale session. Open the main site, sign in as owner, then reopen this page.';
    return;
  }

  run.addEventListener('click', async () => {
    run.disabled = true;
    status.textContent = 'Generating through owner-only Edge Function...';
    audio.hidden = true;
    audio.removeAttribute('src');

    const { data, error } = await client.functions.invoke('generate-dialogue-audio', {
      body: {
        filename: 'dialogue-smoke-test.mp3',
        language_code: 'en',
        inputs: [
          { text: 'Hi! How much is this sweater?', voice_id: 'cgSgspJ2msm6clMCkdW9' },
          { text: "It's twenty dollars.", voice_id: 'JBFqnCBsd6RMkjVDRZzb' }
        ]
      }
    });

    if (error) {
      let details = '';
      try {
        if (error.context && typeof error.context.clone === 'function') {
          details = await error.context.clone().text();
        }
      } catch {}
      status.textContent =
        'FAILED\n' +
        (error.message || String(error)) +
        (details ? '\n\nServer response:\n' + details : '');
      run.disabled = false;
      return;
    }

    status.textContent = 'SUCCESS\n' + JSON.stringify(data, null, 2);
    if (data && data.url) {
      audio.src = data.url;
      audio.hidden = false;
    }
  });
})();
</script>
</body>
</html>
