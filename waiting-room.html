<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Space Whale — Waiting room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-shell.css?v=20260921-navigation-v1">
</head>
<body>
  <main class="waiting-wrap">
    <section class="waiting-card">
      <div class="waiting-orb">SW</div>
      <h1 class="waiting-title" id="waitingTitle">Waiting room</h1>
      <p class="waiting-copy" id="waitingCopy">Checking your lesson…</p>
      <div id="presenceRow" class="waiting-presence"></div>
      <button id="startButton" class="sw-button" type="button" hidden>Start lesson</button>
      <a id="backButton" class="sw-button secondary" href="app.html">Back to account</a>
      <a class="auth-link" href="index.html">Go to Space Whale website</a>
      <div id="waitingMessage" class="sw-message" style="margin-top:16px"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=20260920-backend-v1"></script>
  <script src="auth.js?v=20260920-account-v1"></script>
  <script src="classroom-realtime.js?v=20260920-waiting-v1"></script>
  <script src="waiting-room.js?v=20260921-navigation-v1"></script>
</body>
</html>
