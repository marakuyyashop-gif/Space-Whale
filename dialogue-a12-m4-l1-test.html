<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Whale — A1.2 M4 L1 Dialogue Test</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:820px;margin:48px auto;padding:0 20px;color:#151515}
button{font:inherit;padding:12px 18px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:10px}
audio{width:100%;margin-top:16px}
.small{color:#666;font-size:14px}
</style>
</head>
<body>
<h1>A1.2 · Module 4 · Lesson 1 · Dialogue test</h1>
<p>Jessica = Anna, George = Ben. Names are not spoken.</p>
<p class="small">Text to Dialogue · speed 0.90 · one MP3. This is a test take and is not wired into the lesson yet.</p>
<button id="run">Generate dialogue at 0.90</button>
<pre id="status">Ready.</pre>
<audio id="audio" controls hidden></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
(async () => {
  const client = window.spaceWhaleSupabase;
  const run = document.getElementById('run');
  const status = document.getElementById('status');
  const audio = document.getElementById('audio');

  const { data: { session } } = await client.auth.getSession();
  if (!session) {
    run.disabled = true;
    status.textContent = 'No active Space Whale session. Sign in as owner on the main site, then reopen this page.';
    return;
  }

  const inputs = [
    { text:'Do you like this coat?', voice_id:'cgSgspJ2msm6clMCkdW9' },
    { text:'Yes. It looks good, but it looks like your old coat.', voice_id:'JBFqnCBsd6RMkjVDRZzb' },
    { text:'Yes, it does. And this sweater?', voice_id:'cgSgspJ2msm6clMCkdW9' },
    { text:'It looks warm.', voice_id:'JBFqnCBsd6RMkjVDRZzb' },
    { text:'I like it. How much is it?', voice_id:'cgSgspJ2msm6clMCkdW9' },
    { text:'Thirty euros.', voice_id:'JBFqnCBsd6RMkjVDRZzb' },
    { text:'Okay, I want it. Can you hold it for me, please?', voice_id:'cgSgspJ2msm6clMCkdW9' },
    { text:'Of course.', voice_id:'JBFqnCBsd6RMkjVDRZzb' }
  ];

  run.addEventListener('click', async () => {
    run.disabled = true;
    audio.hidden = true;
    audio.removeAttribute('src');
    status.textContent = 'Generating one dialogue MP3 at speed 0.90...';

    const { data, error } = await client.functions.invoke('generate-dialogue-audio', {
      body: {
        filename: 'a1-2-w4-l1-listening-s090-test.mp3',
        language_code: 'en',
        speed: 0.90,
        inputs
      }
    });

    if (error) {
      let details = '';
      try {
        if (error.context && typeof error.context.clone === 'function') {
          details = await error.context.clone().text();
        }
      } catch {}
      status.textContent =
        'FAILED\n' +
        (error.message || String(error)) +
        (details ? '\n\nServer response:\n' + details : '');
      run.disabled = false;
      return;
    }

    status.textContent = 'SUCCESS\n' + JSON.stringify(data, null, 2);
    if (data?.url) {
      audio.src = data.url + '?v=' + Date.now();
      audio.hidden = false;
    }
  });
})();
</script>
</body>
</html>
