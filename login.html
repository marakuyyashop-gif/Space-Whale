<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Space Whale — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-shell.css?v=1">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="sw-brand">Space Whale</div>
      <h1>Sign in</h1>
      <p>Use your Space Whale account.</p>

      <form id="loginForm" class="sw-form">
        <div class="sw-field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="sw-field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required placeholder="Password">
        </div>
        <button id="loginButton" class="sw-button" type="submit">Sign in</button>
        <a class="sw-button secondary" href="teacher-signup.html">Create teacher account</a>
        <a class="sw-button secondary" href="signup.html">Create student account</a>
        <div id="loginMessage" class="sw-message"></div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=20260920-backend-v1"></script>
  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("loginMessage");
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "dashboard.html";

    window.spaceWhaleSupabase.auth.getSession().then(({ data }) => {
      if (data.session) location.href = next;
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Signing in…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await window.spaceWhaleSupabase.auth.signInWithPassword({
        email,
        password
      });

      button.disabled = false;

      if (error) {
        message.textContent = error.message;
        return;
      }

      location.href = next;
    });
  </script>
</body>
</html>
