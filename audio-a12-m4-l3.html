<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Whale — A1.2 M4 L3 Audio</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:880px;margin:48px auto;padding:0 20px;color:#151515}
button{font:inherit;padding:12px 18px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:10px}
audio{width:100%;margin-top:12px}
.small{color:#666;font-size:14px}
</style>
</head>
<body>
<h1>A1.2 · Module 4 · Lesson 3 — «Что выбираем и почему?»</h1>
<p>One-click generation for all Listen & Repeat clips plus the Nina/Leo dialogue.</p>
<p class="small">Listen & Repeat: Jessica, speed 0.90. Dialogue: Nina = Jessica, Leo = George, speed 0.90. Speaker names are not spoken.</p>
<button id="run">Generate Lesson 3 audio</button>
<pre id="status">Ready.</pre>
<section id="lrPreview">
<h2>Listen & Repeat preview</h2>
<div id="lrPlayers"></div>
</section>
<audio id="dialogue" controls hidden></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
(async () => {
  const client = window.spaceWhaleSupabase;
  const run = document.getElementById('run');
  const status = document.getElementById('status');
  const dialogue = document.getElementById('dialogue');
  const lrPlayers = document.getElementById('lrPlayers');
  const base = 'https://xpeywyonbapnvtjnwawi.supabase.co/storage/v1/object/public/course-audio/a1-2/w4/l3/listen-repeat/';
  const lrItems = [
    ['scarf','L3_W01.mp3'],['My scarf is on the chair.','L3_E01.mp3'],
    ['belt','L3_W02.mp3'],['Do you have a belt for these pants?','L3_E02.mp3'],
    ['gloves','L3_W03.mp3'],['I need my gloves. It’s cold.','L3_E03.mp3'],
    ['cap','L3_W04.mp3'],['Can you put my cap in the backpack, please?','L3_E04.mp3'],
    ['tie','L3_W05.mp3'],['My brother needs a tie for work.','L3_E05.mp3'],
    ['sunglasses','L3_W06.mp3'],['Where are my sunglasses? I need them today.','L3_E06.mp3']
  ];
  for (const [label,file] of lrItems) {
    const wrap = document.createElement('div');
    wrap.style.margin = '10px 0 16px';
    const title = document.createElement('div');
    title.textContent = label;
    title.style.marginBottom = '6px';
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.preload = 'metadata';
    audio.src = base + file;
    audio.style.width = '100%';
    wrap.append(title,audio);
    lrPlayers.append(wrap);
  }


  const { data: { session } } = await client.auth.getSession();
  if (!session) {
    run.disabled = true;
    status.textContent = 'No active Space Whale session. Sign in as owner on the main site, then reopen this page.';
    return;
  }

  const clips = [
    { path:'a1-2/w4/l3/listen-repeat/L3_W01.mp3', text:'Scarf. <break time="0.22s" />', speed:0.90 },
    { path:'a1-2/w4/l3/listen-repeat/L3_E01.mp3', text:'My scarf is on the chair.', speed:0.90 },

    { path:'a1-2/w4/l3/listen-repeat/L3_W02.mp3', text:'Belt. <break time="0.22s" />', speed:0.90 },
    { path:'a1-2/w4/l3/listen-repeat/L3_E02.mp3', text:'Do you have a belt for these pants?', speed:0.90 },

    { path:'a1-2/w4/l3/listen-repeat/L3_W03.mp3', text:'Gloves. <break time="0.22s" />', speed:0.90 },
    { path:'a1-2/w4/l3/listen-repeat/L3_E03.mp3', text:'I need my gloves. It’s cold.', speed:0.90 },

    { path:'a1-2/w4/l3/listen-repeat/L3_W04.mp3', text:'Cap. <break time="0.22s" />', speed:0.90 },
    { path:'a1-2/w4/l3/listen-repeat/L3_E04.mp3', text:'Can you put my cap in the backpack, please?', speed:0.90 },

    { path:'a1-2/w4/l3/listen-repeat/L3_W05.mp3', text:'Tie. <break time="0.22s" />', speed:0.90 },
    { path:'a1-2/w4/l3/listen-repeat/L3_E05.mp3', text:'My brother needs a tie for work.', speed:0.90 },

    { path:'a1-2/w4/l3/listen-repeat/L3_W06.mp3', text:'Sunglasses. <break time="0.22s" />', speed:0.90 },
    { path:'a1-2/w4/l3/listen-repeat/L3_E06.mp3', text:'Where are my sunglasses? I need them today.', speed:0.90 }
  ];

  const dialogueInputs = [
    { text:'I need a scarf for my sister.', voice_id:'cgSgspJ2msm6clMCkdW9' },
    { text:'Which one do you like?', voice_id:'JBFqnCBsd6RMkjVDRZzb' },
    { text:'This one. What do you think?', voice_id:'cgSgspJ2msm6clMCkdW9' },
    { text:'I think it looks good. How much is it?', voice_id:'JBFqnCBsd6RMkjVDRZzb' },
    { text:'Twenty euros.', voice_id:'cgSgspJ2msm6clMCkdW9' },
    { text:'Why do you like it?', voice_id:'JBFqnCBsd6RMkjVDRZzb' },
    { text:'Because it looks warm. My sister walks to work, and it’s cold in the morning.', voice_id:'cgSgspJ2msm6clMCkdW9' },
    { text:'Does she need gloves too?', voice_id:'JBFqnCBsd6RMkjVDRZzb' },
    { text:'No, she has some.', voice_id:'cgSgspJ2msm6clMCkdW9' }
  ];

  function errorDetails(error) {
    return (async () => {
      let details = '';
      try {
        if (error?.context && typeof error.context.clone === 'function') {
          details = await error.context.clone().text();
        }
      } catch {}
      return (error?.message || String(error)) + (details ? '\n\nServer response:\n' + details : '');
    })();
  }

  run.addEventListener('click', async () => {
    run.disabled = true;
    dialogue.hidden = true;
    dialogue.removeAttribute('src');

    status.textContent = '1/2 Generating 12 Listen & Repeat clips...';
    const { data: lrData, error: lrError } = await client.functions.invoke('generate-course-tts', {
      body: {
        voice_id:'cgSgspJ2msm6clMCkdW9',
        clips
      }
    });

    if (lrError) {
      status.textContent = 'FAILED — Listen & Repeat\n' + await errorDetails(lrError);
      run.disabled = false;
      return;
    }

    status.textContent = '2/2 Generating Nina + Leo dialogue...';
    const { data: dData, error: dError } = await client.functions.invoke('generate-dialogue-audio', {
      body: {
        filename:'a1-2-w4-l3-listening-s090.mp3',
        language_code:'en',
        speed:0.90,
        inputs:dialogueInputs
      }
    });

    if (dError) {
      status.textContent = 'PARTIAL SUCCESS\nListen & Repeat was generated.\n\nDialogue FAILED:\n' + await errorDetails(dError);
      run.disabled = false;
      return;
    }

    status.textContent =
      'SUCCESS\n' +
      'Listen & Repeat: ' + (lrData?.clips?.length || 0) + ' clips\n' +
      'Dialogue: ' + (dData?.turns || 0) + ' turns, ' + (dData?.bytes || 0) + ' bytes\n' +
      'Speed: 0.90';

    if (dData?.url) {
      dialogue.src = dData.url + '?v=' + Date.now();
      dialogue.hidden = false;
    }
  });
})();
</script>
</body>
</html>
