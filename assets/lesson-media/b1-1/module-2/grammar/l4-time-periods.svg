<svg xmlns="http://www.w3.org/2000/svg" width="480" height="392" viewBox="0 0 480 392" role="img" aria-labelledby="title desc"><title id="title">Two time periods</title><desc id="desc">Now: Eva is not independent. She does not make decisions on her own. Last year: The team was not competitive. It did not enter the competition.</desc><g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#35363a" font-size="20"><rect x="16" y="12" width="448" height="174" rx="26" fill="#f7f7f8" stroke="#d3d3d7"/><text x="40" y="50" font-size="17" fill="#757780">Now</text><text x="40" y="90"><tspan x="40">Eva is not independent.</tspan><tspan x="40" dy="35">She does not make decisions</tspan><tspan x="40" dy="29">on her own.</tspan></text><rect x="16" y="206" width="448" height="174" rx="26" fill="#f7f7f8" stroke="#d3d3d7"/><text x="40" y="244" font-size="17" fill="#757780">Last year</text><text x="40" y="284"><tspan x="40">The team was not competitive.</tspan><tspan x="40" dy="35">It did not enter the competition.</tspan></text></g></svg>
