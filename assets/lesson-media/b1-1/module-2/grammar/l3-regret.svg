<svg xmlns="http://www.w3.org/2000/svg" width="480" height="328" viewBox="0 0 480 328" role="img" aria-labelledby="title desc"><title id="title">Alex’s situation</title><desc id="desc">Alex told a private story in front of other people. Alex’s friend felt embarrassed. Alex now feels ashamed.</desc><g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#35363a" font-size="20"><rect x="16" y="12" width="448" height="304" rx="28" fill="#f7f7f8" stroke="#d3d3d7"/><text x="40" y="58"><tspan x="40">Alex told a private story</tspan><tspan x="40" dy="29">in front of other people.</tspan></text><path d="M40 114h400M40 210h400" stroke="#dedee2"/><text x="40" y="157"><tspan x="40">Alex’s friend felt</tspan><tspan x="40" dy="29">embarrassed.</tspan></text><text x="40" y="263">Alex now feels ashamed.</text></g></svg>
