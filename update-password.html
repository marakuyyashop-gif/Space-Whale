<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Space Whale — Choose new password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-shell.css?v=20260921-navigation-v1">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <a class="sw-brand" href="index.html">Space Whale</a>
      <h1>Choose new password</h1>
      <p>Create a new password for your account.</p>

      <form id="updatePasswordForm" class="sw-form">
        <div class="sw-field">
          <label for="password">New password</label>
          <input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
        </div>
        <div class="sw-field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat password">
        </div>
        <button id="updateButton" class="sw-button" type="submit">Save new password</button>
        <div id="updateMessage" class="sw-message"></div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=20260920-backend-v1"></script>
  <script>
    const form = document.getElementById("updatePasswordForm");
    const button = document.getElementById("updateButton");
    const message = document.getElementById("updateMessage");

    window.spaceWhaleSupabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        message.textContent = "Recovery link verified. Choose your new password.";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      button.disabled = true;
      message.textContent = "Saving new password…";

      const { error } = await window.spaceWhaleSupabase.auth.updateUser({ password });
      button.disabled = false;

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = "Password updated. Opening your account…";
      setTimeout(() => { location.href = "app.html"; }, 700);
    });
  </script>
</body>
</html>
