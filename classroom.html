<a class="workspace-icon" href="index.html" aria-label="Home" data-tooltip="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></svg></a>
<a class="workspace-icon" href="students.html" aria-label="Ученики" data-tooltip="Ученики"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></a>
<button id="libraryTab" class="workspace-icon" type="button" aria-label="Библиотека" data-tooltip="Библиотека" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M3 5l2 1-2 1M3 11l2 1-2 1M3 17l2 1-2 1"/></svg></button>
<button id="classTab" class="workspace-icon" type="button" aria-label="Класс" data-tooltip="Класс" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
</nav>
</aside><button id="workspaceSidebarToggle" class="workspace-sidebar-toggle" type="button" aria-controls="workspaceSidebar" aria-expanded="true" aria-label="Свернуть меню"><span aria-hidden="true"></span></button></div>
