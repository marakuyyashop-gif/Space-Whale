<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Space Whale — Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-shell.css?v=20260921-library-v1">
</head>
<body class="teacher-home-body">
  <div id="teacherApp" class="teacher-app" hidden>
    <aside class="teacher-sidebar" data-teacher-sidebar data-active="library"></aside>

    <main class="teacher-main library-main">
      <header class="library-page-header">
        <div>
          <span class="teacher-eyebrow">TEACHING MATERIALS</span>
          <h1>Library</h1>
          <p>Choose a Space Whale lesson or keep your own reusable lesson templates.</p>
        </div>
        <button id="newPersonalLesson" class="sw-button" type="button">New personal lesson</button>
      </header>

      <section class="library-toolbar">
        <div class="students-search-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="librarySearch" type="search" placeholder="Search lessons">
        </div>
        <select id="libraryLevel" class="students-filter">
          <option value="all">All levels</option>
        </select>
      </section>

      <section class="library-tabs">
        <button class="library-tab active" type="button" data-tab="platform">Space Whale</button>
        <button class="library-tab" type="button" data-tab="teacher">My lessons</button>
      </section>

      <section id="libraryContent" class="library-content"></section>
    </main>
  </div>

  <div id="pageLoading" class="page-loading">Loading library…</div>

  <dialog id="previewDialog" class="sw-dialog library-dialog">
    <div class="dialog-card">
      <div class="dialog-header">
        <div>
          <span class="teacher-eyebrow" id="previewMeta">LESSON</span>
          <h2 id="previewTitle">Lesson</h2>
        </div>
        <button class="dialog-close" type="button" data-close="previewDialog">×</button>
      </div>
      <p id="previewSummary" class="dialog-help"></p>
      <div id="previewActivities" class="library-preview-activities"></div>
      <div class="dialog-actions">
        <button class="sw-button secondary" type="button" data-close="previewDialog">Close</button>
        <a id="previewUseLink" class="sw-button" href="schedule.html">Use in schedule</a>
      </div>
    </div>
  </dialog>

  <dialog id="personalLessonDialog" class="sw-dialog">
    <form id="personalLessonForm" class="dialog-card">
      <div class="dialog-header">
        <div>
          <span class="teacher-eyebrow">MY LIBRARY</span>
          <h2>Create personal lesson</h2>
        </div>
        <button class="dialog-close" type="button" data-close="personalLessonDialog">×</button>
      </div>
      <div class="sw-field">
        <label for="personalTitle">Lesson title</label>
        <input id="personalTitle" type="text" required placeholder="Conversation practice">
      </div>
      <div class="sw-field">
        <label for="personalLevel">Level</label>
        <input id="personalLevel" type="text" placeholder="A2.1">
      </div>
      <div class="sw-field">
        <label for="personalSummary">Short description</label>
        <textarea id="personalSummary" rows="4" placeholder="What this lesson is for"></textarea>
      </div>
      <div class="dialog-actions">
        <button class="sw-button secondary" type="button" data-close="personalLessonDialog">Cancel</button>
        <button id="personalLessonSubmit" class="sw-button" type="submit">Create lesson</button>
      </div>
      <div id="personalLessonMessage" class="sw-message"></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=20260920-backend-v1"></script>
  <script src="auth.js?v=20260921-teacher-settings-v1"></script>
  <script src="teacher-shell.js?v=20260921-shell-v1"></script>
  <script src="library.js?v=20260921-v1"></script>
</body>
</html>
